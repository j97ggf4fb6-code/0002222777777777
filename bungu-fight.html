<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>文具ファイト！</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#fffdf5;--line:#a9cdee;--margin:#e57373;--ink:#2b2d42;--bg:#d9d2bd;--card:#fff9c4;--btn:#ffe066;--btn2:#ff8fa3;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#2b2d36;--line:#3f5b82;--margin:#a14a4a;--ink:#f4f1e6;--bg:#17181c;--card:#4a4630;--btn:#a88a1a;--btn2:#a8465c;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#2b2d36;--line:#3f5b82;--margin:#a14a4a;--ink:#f4f1e6;--bg:#17181c;--card:#4a4630;--btn:#a88a1a;--btn2:#a8465c;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:500;min-height:100vh;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;padding:10px}
.sheet{background:var(--paper);border-radius:6px;box-shadow:3px 4px 0 rgba(0,0,0,.22);position:relative;
background-image:linear-gradient(90deg,transparent 28px,var(--margin) 28px,var(--margin) 30px,transparent 30px),repeating-linear-gradient(var(--paper) 0 23px,var(--line) 23px 24px)}
.sheet::before,.sheet::after{content:"";position:absolute;top:-8px;width:60px;height:18px;background:rgba(255,224,102,.75);transform:rotate(-4deg)}
.sheet::before{left:14px}.sheet::after{right:14px;transform:rotate(5deg)}
h1{font-weight:900;font-size:34px;margin:0;text-align:center;letter-spacing:.04em;transform:rotate(-2deg);padding-top:6px}
h1 span{background:linear-gradient(transparent 55%,#ffd23f 55%,#ffd23f 90%,transparent 90%);padding:0 6px}
.sub{text-align:center;margin:4px 0 12px;font-size:14px}
#menu{padding:22px 12px 14px 38px}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:6px 4px 8px;text-align:center;cursor:pointer;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px}
.card:nth-child(odd){transform:rotate(-1.2deg)}.card:nth-child(even){transform:rotate(1deg)}
.card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.card b{font-size:17px;font-weight:900}.card small{font-size:12px;line-height:1.3}
#game{display:none}
#stage{overflow:hidden}
canvas{display:block;width:100%;aspect-ratio:4/3;touch-action:none}
#pad{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;gap:8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#pad .g{display:flex;gap:10px}
#pad button{font:inherit;font-weight:900;color:#2b2d42;background:var(--btn);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);width:68px;height:68px;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none}
#pad button.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#pad button[data-k=a]{background:var(--btn2);width:84px;height:84px;font-size:18px}
#pad button[data-k=s]{background:#ccc;color:#555}
#pad button[data-k=s].rdy{background:#7bdff2;color:#12263a;animation:pulse .5s infinite alternate}
@keyframes pulse{to{filter:brightness(1.25)}}
@media (prefers-reduced-motion:reduce){#pad button[data-k=s].rdy{animation:none}}
.row{display:flex;gap:8px;margin-top:12px;justify-content:space-between;font-size:12px;align-items:center}
.row button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:6px 10px}
#end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.55);color:#fff;text-align:center}
#end h2{font-size:38px;font-weight:900;margin:0;text-shadow:3px 3px 0 #000}
#end button{font:inherit;font-weight:900;font-size:17px;background:var(--btn);color:#2b2d42;border:2.5px solid #2b2d42;border-radius:12px;padding:10px 20px;box-shadow:0 4px 0 #2b2d42}
.hint{font-size:11px;opacity:.75;text-align:center;margin-top:8px}
#game{display:none;position:fixed;inset:0;z-index:10;background:var(--bg);align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#game.show{display:flex}
#wrap{position:relative;width:min(100%,calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*16/9));width:min(100%,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*16/9));aspect-ratio:16/9;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#wrap::before,#wrap::after{display:none}
#wrap canvas{width:100%;height:100%;aspect-ratio:auto}
#ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 1.5% 1.2%;pointer-events:none;-webkit-touch-callout:none}
#ctl .g{display:flex;gap:clamp(5px,1.6dvh,12px)}
#ctl button{pointer-events:auto;font:inherit;font-weight:900;font-size:clamp(11px,2.6dvh,15px);color:#2b2d42;background:var(--btn);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);width:clamp(42px,11.5dvh,64px);height:clamp(42px,11.5dvh,64px);opacity:.92;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
#ctl button.on{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#ctl button[data-k=a]{background:#ffc9d4}
#ctl button[data-k=h]{background:#ff8fa3}
#ctl button[data-k=g]{background:#a5d8ff}
#ctl button[data-k=k]{background:linear-gradient(to top,#bbb var(--p,0%),#b2f2bb var(--p,0%))}
#ctl button[data-k=s]{background:#ccc;color:#555}
#ctl button[data-k=s].rdy{background:#7bdff2;color:#12263a;animation:pulse .5s infinite alternate}
#quit{position:absolute;top:62px;left:50%;transform:translateX(-50%);font:inherit;font-size:12px;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:2px 10px;opacity:.8}
#rot{display:none;position:absolute;inset:0;z-index:20;background:var(--bg);color:var(--ink);align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:20px;line-height:1.8}
@media (orientation:portrait){#game.show #rot{display:flex}}
#lv{display:flex;gap:8px;justify-content:center;margin:0 0 12px}
#lv button{font:inherit;font-weight:900;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:5px 12px;font-size:13px}
#lv button.sel{background:var(--btn2);box-shadow:2px 2px 0 var(--ink)}
#zl{position:absolute;left:0;bottom:0;width:46%;height:80%;touch-action:none;z-index:2}
#sb{position:absolute;left:5%;bottom:6%;width:clamp(88px,32dvh,150px);aspect-ratio:1;border-radius:50%;border:3px dashed var(--ink);background:rgba(255,255,255,.2);opacity:.38;pointer-events:none;z-index:3}
#sb.act{opacity:.75;border-style:solid}
#sb i{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:var(--ink);opacity:.85}
#abs{position:absolute;right:2%;bottom:4%;display:flex;align-items:flex-end;gap:clamp(8px,2.6dvh,20px);pointer-events:none;z-index:4}
#abs .gr{display:grid;grid-template-columns:auto auto;gap:clamp(6px,2dvh,14px);align-items:end;justify-items:center}
.ab{pointer-events:auto;font:inherit;font-weight:900;color:#2b2d42;border:3px solid var(--ink);border-radius:50%;box-shadow:0 5px 0 var(--ink);padding:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;opacity:.94;display:flex;align-items:center;justify-content:center}
.ab.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);filter:brightness(1.12)}
.ab.lg{width:clamp(62px,20dvh,104px);height:clamp(62px,20dvh,104px);font-size:clamp(22px,7dvh,36px);background:#ff8fa3}
.ab.lg[data-k=a]{background:#ffd23f}
.ab.md{width:clamp(50px,15.5dvh,80px);height:clamp(50px,15.5dvh,80px);font-size:clamp(11px,3.5dvh,17px)}
.ab.sm{width:clamp(44px,13dvh,66px);height:clamp(44px,13dvh,66px);font-size:clamp(10px,3dvh,14px);background:#a5d8ff}
.ab[data-k=k]{background:linear-gradient(to top,#bbb var(--p,0%),#b2f2bb var(--p,0%))}
.ab[data-k=s]{background:#ccc;color:#555}
.ab[data-k=s].rdy{background:#7bdff2;color:#12263a;animation:pulse .5s infinite alternate}
#tb{position:absolute;top:15%;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
#tb button{font-size:15px;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:0;opacity:.85;touch-action:manipulation}
#ps{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.6);color:#fff;z-index:15}
#ps h2{font-size:34px;font-weight:900;margin:0;text-shadow:3px 3px 0 #000}
#ps button{font:inherit;font-weight:900;font-size:17px;background:var(--btn);color:#2b2d42;border:2.5px solid #2b2d42;border-radius:12px;padding:10px 22px;box-shadow:0 4px 0 #2b2d42}
#md{display:flex;gap:8px;justify-content:center;margin:0 0 10px}
#md button{font:inherit;font-weight:900;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:5px 12px;font-size:13px}
#md button.sel{background:var(--btn2);box-shadow:2px 2px 0 var(--ink)}
#tools{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
#tools button{font:inherit;font-weight:700;font-size:12px;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:6px 10px}
#nm{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:12px}
#nm .box{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:14px;width:min(460px,100%);max-height:92dvh;overflow:auto;box-shadow:4px 5px 0 var(--ink)}
#nm h3{margin:0 0 6px;font-weight:900;font-size:20px}
#nm p{font-size:13px;margin:6px 0}
#nm textarea{width:100%;height:64px;font:11px monospace;border:2px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink);padding:6px;resize:none}
#nm button{font:inherit;font-weight:900;color:#2b2d42;background:var(--btn);border:2px solid var(--ink);border-radius:10px;padding:8px 14px;margin:4px 6px 4px 0}
</style>
</head>
<body>
<div id="app">
 <section id="menu" class="sheet">
  <h1><span>文具ファイト！</span></h1>
  <p class="sub"><span id="mdHint">キャラをタップでスタート</span><br>📱 横向き推奨・2ラウンド先取</p>
  <div id="md"><button data-m="cpu" class="sel">CPUと対戦</button><button data-m="online">オンライン対戦</button></div><div id="lv"><button data-v="0">かんたん</button><button data-v="1" class="sel">ふつう</button><button data-v="2">むずかしい</button></div><div id="grid"></div><div id="tools"><button id="cpSrc">📋 HTMLコードをコピー</button><button id="dlSrc">⬇ HTMLを保存</button></div>
 </section>
 <section id="game">
 <div id="wrap" class="sheet"><canvas id="cv"></canvas>
  <div id="tb"><button id="pz" aria-label="ポーズ">⏸</button><button id="mu" aria-label="サウンド">🔊</button></div>
  <div id="zl"></div><div id="sb"><i></i></div>
  <div id="abs">
   <button class="ab sm" data-k="g">ガード</button>
   <div class="gr"><button class="ab md" data-k="s" id="spb">必殺</button><button class="ab md" data-k="k" id="kb">スキル</button><button class="ab lg" data-k="h">強</button><button class="ab lg" data-k="a">弱</button></div>
  </div>
  <div id="ps"><h2>ポーズ中</h2><button id="resume">つづける</button><button id="quit2">やめる</button></div>
  <div id="end"><h2 id="endT"></h2><button id="again">もういちど</button><button id="back">キャラ選択へ</button></div>
 </div>
 <div id="rot" onclick="this.style.display='none'">📱<br>スマホを横向きにしてね<br><small style="font-weight:500;font-size:13px">（タップでそのまま遊ぶ）</small></div>
</section>


</div>
<div id="nm"><div class="box">
 <h3>🌐 オンライン対戦</h3>
 <div id="nTop"><p>友だちも同じこのページを開いて、コードを交換してつなぎます（サーバー不要）。</p><button id="nHost">部屋を作る（ホスト）</button><button id="nJoin">部屋に入る（ゲスト）</button></div>
 <div id="nWork" hidden>
  <div id="rowOut" hidden><p id="lOut"></p><textarea id="cOut" readonly onfocus="this.select()"></textarea><button id="cCopy">コピー</button><button id="cShare">送る</button></div>
  <div id="rowIn" hidden><p id="lIn"></p><textarea id="cIn" placeholder="ここに貼り付け"></textarea><button id="cGo">つなぐ</button></div>
 </div>
 <p id="nStat"></p><button id="nClose">とじる</button>
</div></div>
<script>

const C=[

let INK='#2b2d42',PAPER='#fffdf5';
function readCols(){const s=getComputedStyle(document.documentElement);INK=s.getPropertyValue('--ink').trim()||INK;PAPER=s.getPropertyValue('--paper').trim()||PAPER}
const DK='#2b2d42',lerp=(a,b,t)=>a+(b-a)*t,eo=t=>1-(1-t)*(1-t);

function rr(g,x,y,w,h,r,f){g.beginPath();g.roundRect(x,y,w,h,r);ol(g,f)}
function poly(g,p,f){g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();ol(g,f,2)}
function limb(g,pts,col,w){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.strokeStyle=DK;g.lineWidth=w+3;g.stroke();g.strokeStyle=col;g.lineWidth=w;g.stroke()}
const WP={
pencil(g){rr(g,-6,-3.5,5,7,1.5,'#ff8fa3');rr(g,-1,-3.5,4,7,0,'#c0c7cf');rr(g,3,-3.5,32,7,0,'#ffd23f');g.fillStyle='#f2a900';g.fillRect(8,-1,24,2);poly(g,[[35,-3.5],[48,0],[35,3.5]],'#f1d3a1');poly(g,[[43,-1.4],[48,0],[43,1.4]],'#333')},
eraser(g){rr(g,-2,-2,10,4,1,'#8d99ae');rr(g,6,-10,22,20,4,'#ff8fa3');g.fillStyle='#3a86ff';g.fillRect(6,-4,22,8);g.beginPath();g.roundRect(6,-10,22,20,4);g.stroke()},
scissors(g){for(const s of[-1,1]){g.save();g.rotate(s*.16);poly(g,[[4,0],[34,-s*1.5],[34,s*2.5]],s<0?'#e9ecef':'#ced4da');g.restore()}for(const s of[-1,1]){g.beginPath();g.arc(-4,s*5,5,0,7);ol(g,'#ff7b00',2)}},
cutter(g){rr(g,-4,-5,20,10,2,'#ffd23f');g.fillStyle=DK;g.fillRect(2,-5,2.5,10);g.fillRect(9,-5,2.5,10);poly(g,[[16,-4],[44,-1],[44,2],[16,5]],'#dfe3e8')},
stapler(g){rr(g,-2,-8,34,9,3,'#e63946');rr(g,-2,0,34,6,2,'#555');g.fillStyle='rgba(255,255,255,.5)';g.fillRect(4,-6,16,2)},
glue(g){rr(g,-2,-7,22,14,6,'#f8f9fa');g.fillStyle='#4cc9f0';g.fillRect(6,-7,8,14);g.beginPath();g.roundRect(-2,-7,22,14,6);g.stroke();rr(g,19,-4,6,8,2,'#fff');rr(g,24,-3,8,6,2,'#ff9f1c')}};
const DEC={
pencil(g){g.fillStyle='#f2a900';g.fillRect(-10,-50,20,3);g.fillStyle='#ff8fa3';g.beginPath();g.arc(5,-57,3.2,0,7);g.fill()},
eraser(g,b){g.fillStyle='#3a86ff';g.fillRect(-10*b,-52,20*b,10);g.strokeStyle=DK;g.lineWidth=1.5;g.strokeRect(-10*b,-52,20*b,10)},

cutter(g){g.fillStyle=DK;for(let i=0;i<3;i++)g.fillRect(-10,-56+i*9,20,3);g.fillStyle='#e63946';g.fillRect(-10,-66,20,5)},
stapler(g){g.fillStyle='#c0c7cf';for(let i=0;i<3;i++){g.beginPath();g.arc(0,-54+i*8,1.8,0,7);g.fill()}g.fillStyle='#fff';g.fillRect(-3,-64,6,5)},
glue(g){g.fillStyle='#4cc9f0';g.fillRect(-7,-56,14,12);g.strokeStyle=DK;g.lineWidth=1.5;g.strokeRect(-7,-56,14,12);g.fillStyle='#fff';g.font='900 7px sans-serif';g.textAlign='center';g.fillText('のり',0,-47)}};
function hair(g,c,back){const hc=c.hc,k=c.hs;
 if(back){
  if(k==='twin'){for(const q of[[-12,-70,.35],[-9,-60,.15]]){g.beginPath();g.ellipse(q[0],q[1],4.5,13,q[2],0,7);ol(g,hc,2)}}
  else if(k==='bob'||k==='wave'){g.beginPath();g.ellipse(-4,-72,13,13,0,0,7);ol(g,hc,2)}
  else if(k==='slick'){g.beginPath();g.ellipse(-13,-71,9,5,-.5,0,7);ol(g,hc,2)}

function applySnap(m){if(!P1||m.n<=lastSeq)return;lastSeq=m.n;
 [[P1,m.f[0]],[P2,m.f[1]]].forEach(([f,a])=>{FK.forEach((k,i)=>{if(k==='x')f.x=Math.abs(a[0]-f.x)>60?a[0]:f.x+(a[0]-f.x)*.6;else f[k]=typeof f[k]==='boolean'?!!a[i]:a[i]});f.pt=a[FK.length]?'h':'l'});
 st=m.st;stT=m.sT;timer=m.tm;round=m.r;msg=m.ms;shake=Math.max(shake,m.sh);flash=Math.max(flash,m.fl);

 for(const e of m.e)if(e[0]>lastEv){lastEv=e[0];applyEv(e)}

 else if(m.t==='rm'&&NET.role==='host')rematch();
 else if(m.i!==undefined&&NET.role==='host')remI=unmask(m.i);

 if(dc.label==='ctl'){NET.ctl=dc;dc.onopen=()=>{NET.open=true;stat('つながった！');if(NET.role==='guest')ctlSend({t:'hi',c:NET.ci})};dc.onclose=()=>netLost()}else NET.gdc=dc}
function mkPc(role){const pc=NET.pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});NET.role=role;
 pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')netLost()};
 if(role==='host'){setupDC(pc.createDataChannel('ctl'));setupDC(pc.createDataChannel('g',{ordered:false,maxRetransmits:0}))}else pc.ondatachannel=e=>setupDC(e.channel);return pc}
const gathered=pc=>new Promise(res=>{if(pc.iceGatheringState==='complete')return res();const h=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',h);res()}};pc.addEventListener('icegatheringstatechange',h);setTimeout(res,4500)});
const b64=b=>btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function pack(d){const j=JSON.stringify({t:d.type,s:d.sdp});
 if(typeof CompressionStream!=='undefined'){const s=new Blob([j]).stream().pipeThrough(new CompressionStream('deflate'));const u=new Uint8Array(await new Response(s).arrayBuffer());let bin='';u.forEach(c=>bin+=String.fromCharCode(c));return'Z'+b64(bin)}
 return'R'+b64(unescape(encodeURIComponent(j)))}
async function unpack(code){code=code.replace(/\s/g,'');let s=code.slice(1).replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);const b=atob(s);let j;
 if(code[0]==='Z'){const u=Uint8Array.from(b,c=>c.charCodeAt(0));j=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate'))).text()}else j=decodeURIComponent(escape(b));
 const o=JSON.parse(j);return{type:o.t,sdp:o.s}}
function leave(){const{ctl,gdc,pc}=NET;NET.role=null;NET.open=false;NET.pc=NET.ctl=NET.gdc=null;try{ctl&&ctl.close();gdc&&gdc.close();pc&&pc.close()}catch(e){}evq=[];over=false}
function netLost(){if(!NET.role)return;if(!NET.open){stat('つながりませんでした。回線によっては接続できません（Wi-Fiを変える／別の端末で試す）');return}
 running=false;cancelAnimationFrame(raf);$('endT').textContent='通信が切れました';$('again').style.display='none';$('end').style.display='flex'}

function bar(x,y,w,h,pct,col,rev){g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x,y,w,h);g.fillStyle=col;const ww=w*Math.max(0,Math.min(1,pct));g.fillRect(rev?x+w-ww:x,y,ww,h);g.strokeStyle=INK;g.lineWidth=2;g.strokeRect(x,y,w,h)}
function hud(f,left){const bw=200,x=left?14:W-14-bw;
 g.fillStyle=INK;g.font='900 14px "Zen Maru Gothic",sans-serif';g.textAlign=left?'left':'right';g.fillText(f.c.n,left?x:x+bw,14);
 bar(x,18,bw,14,f.hp/f.max,'#ff6b9d',!left);bar(x,35,bw,6,f.gauge/100,f.gauge>=100?'#38d9f0':'#ffd23f',!left);
 bar(left?x:x+bw/2,44,bw/2,4,1-f.skcd/f.c.sk.cd,f.skcd<=0?'#69db7c':'#adb5bd',!left);bar(left?x:x+bw/2,50,bw/2,4,f.gg/100,f.gg<30?'#e03131':'#4dabf7',!left);
 for(let i=0;i<2;i++){g.beginPath();g.arc(left?x+6+i*14:x+bw-6-i*14,66,5,0,7);g.fillStyle=i<f.wins?'#ffd23f':'rgba(0,0,0,.12)';g.fill();g.lineWidth=1.5;g.strokeStyle=INK;g.stroke()}
 if(f.combo>=2&&f.comboT>0){g.font='900 24px "Zen Maru Gothic",sans-serif';g.lineWidth=5;g.strokeStyle=PAPER;const tx=left?x:x+bw,ty=92;g.strokeText(f.combo+' HIT!',tx,ty);g.fillStyle='#e8590c';g.fillText(f.combo+' HIT!',tx,ty)}}

function decor(){g.save();g.translate(70,132);g.rotate(-.1);g.fillStyle='#ffe066';g.fillRect(-28,-28,56,56);g.fillStyle='rgba(0,0,0,.14)';g.fillRect(-28,24,56,4);g.fillStyle='#2b2d42';g.font='900 12px "Zen Maru Gothic",sans-serif';g.textAlign='center';g.fillText('がんばれ',0,-3);g.fillText('ふでばこ',0,13);g.restore();
 g.save();g.translate(432,128);g.rotate(.5);g.strokeStyle='#8d99ae';g.lineWidth=3;g.beginPath();g.roundRect(-9,-24,18,48,9);g.stroke();g.beginPath();g.roundRect(-4,-15,8,32,4);g.stroke();g.restore();
 g.strokeStyle='rgba(139,94,60,.3)';g.lineWidth=4;g.beginPath();g.arc(300,160,26,0,6.1);g.stroke();
 g.strokeStyle='rgba(70,110,200,.45)';g.lineWidth=2;g.beginPath();[[200,100],[212,128],[184,110],[216,110],[188,128],[200,100]].forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke()}
function vsScreen(){const p=1-stT/110,dx=(1-eo(Math.min(1,p*3.5)))*220;
 g.fillStyle=PAPER;g.fillRect(0,0,W,H);
 g.fillStyle=P1.c.col;g.beginPath();g.moveTo(0,0);g.lineTo(W*.6,0);g.lineTo(W*.4,H);g.lineTo(0,H);g.fill();
 g.fillStyle=P2.c.col;g.beginPath();g.moveTo(W*.6,0);g.lineTo(W,0);g.lineTo(W,H);g.lineTo(W*.4,H);g.fill();
 g.strokeStyle=DK;g.lineWidth=4;g.beginPath();g.moveTo(W*.6,0);g.lineTo(W*.4,H);g.stroke();
 for(const q of[[P1,115-dx,1],[P2,W-115+dx,-1]]){g.save();g.translate(q[1],232);g.scale(1.55,1.55);drawChar(g,q[0].c,{x:0,y:0,dir:q[2],t:T,atk:0,hit:0,mv:false});g.restore()}
 g.font='900 19px "Zen Maru Gothic",sans-serif';g.lineWidth=5;g.strokeStyle=PAPER;g.fillStyle=DK;
 g.textAlign='left';let s=P1.c.n+'（'+P1.c.d+'）';g.strokeText(s,14,28);g.fillText(s,14,28);
 g.textAlign='right';s=P2.c.n+'（'+P2.c.d+'）';g.strokeText(s,W-14,28);g.fillText(s,W-14,28);
 const k=1+Math.max(0,.4-p*2);g.save();g.translate(W/2,H/2+12);g.scale(k,k);g.font='900 64px "Zen Maru Gothic",sans-serif';g.textAlign='center';g.lineWidth=9;g.strokeStyle=PAPER;g.strokeText('VS',0,0);g.fillStyle='#e63946';g.fillText('VS',0,0);g.restore()}
function render(){
 g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
 if(st==='vs'){vsScreen();return}
 g.save();if(shake>.3)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 decor();
 g.fillStyle='#f6d365';g.fillRect(0,GY,W,28);g.strokeStyle=DK;g.lineWidth=2;g.strokeRect(-2,GY,W+4,28);
 g.fillStyle=DK;g.font='700 8px sans-serif';g.textAlign='center';
 for(let i=0;i<=48;i++){const x=i*10+5,l=i%5===0?10:6;g.beginPath();g.moveTo(x,GY);g.lineTo(x,GY+l);g.lineWidth=1.2;g.stroke();if(i%5===0&&i>0&&i<48)g.fillText(i/5,x,GY+21)}
 for(const f of[P1,P2]){g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(f.x,GY+3,f.c.w*.5,4,0,0,7);g.fill()}
 const fin=st==='ko'||st==='over';
 for(const f of[P2,P1]){const oth=f===P1?P2:P1;drawChar(g,f.c,{x:f.x,y:f.y,dir:f.dir,t:f.t,atk:f.atk,am:f.am,hit:f.hit,mv:f.mv,guard:f.guard,gd:f.gd,jg:f.jg,gbk:f.gbk,pt:f.pt,ko:fin&&f.hp<=0,win:fin&&f.hp>oth.hp,air:f.y<GY-2,sl:f.slow>0})}
 for(const r of rings){g.globalAlpha=r.l/14;g.strokeStyle=r.c;g.lineWidth=4;g.beginPath();g.arc(r.x,r.y,r.r,0,7);g.stroke()}g.globalAlpha=1;
 for(const s of shots){if(s.kind==='glue'){g.beginPath();g.arc(s.x,s.y,8,0,7);g.fillStyle='#8ecae6';g.fill();g.lineWidth=2;g.strokeStyle=DK;g.stroke()}
  else if(s.kind==='crumb'){g.beginPath();g.arc(s.x,s.y,4.5,0,7);g.fillStyle='#ffb3c1';g.fill();g.lineWidth=1.5;g.strokeStyle=DK;g.stroke()}
  else{g.fillStyle='#c0c7cf';g.fillRect(s.x-8,s.y-2,16,4);g.strokeStyle=DK;g.lineWidth=1.5;g.strokeRect(s.x-8,s.y-2,16,4)}}
 for(const p of parts){g.globalAlpha=Math.min(1,p.l/14);g.fillStyle=p.c;g.fillRect(p.x,p.y,3+p.r*.6,3+p.r*.5)}g.globalAlpha=1;
 for(const p of pops){g.globalAlpha=Math.min(1,p.l/12);g.font=`900 ${p.sz}px "Zen Maru Gothic",sans-serif`;g.textAlign='center';g.lineWidth=4;g.strokeStyle=PAPER;const y=p.y-(44-p.l)*.6;g.strokeText(p.txt,p.x,y);g.fillStyle=p.col;g.fillText(p.txt,p.x,y)}g.globalAlpha=1;
 const me=NET.role==='guest'?P2:P1;
 if(NET.role){g.font='900 10px "Zen Maru Gothic",sans-serif';g.textAlign='center';g.lineWidth=3;g.strokeStyle=PAPER;g.fillStyle='#e03131';g.strokeText('▼YOU',me.x,me.y-me.c.h-12);g.fillText('▼YOU',me.x,me.y-me.c.h-12)}
 g.restore();
 hud(P1,true);hud(P2,false);
 g.fillStyle=INK;g.font='900 24px "Zen Maru Gothic",sans-serif';g.textAlign='center';g.fillText(Math.max(0,timer),W/2,32);
 if(st==='ready')banner('ROUND '+round,40);else if(st==='fight'&&stT>0)banner('FIGHT!',48);else if(st==='ko')banner(msg,48);
 if(flash>0){g.fillStyle='rgba(255,255,255,.45)';g.fillRect(0,0,W,H)}
 const kp=me.skcd>0?Math.round(me.skcd/me.c.sk.cd*100)+'%':'0%';
 if(kp!==lastKP){lastKP=kp;kb.style.setProperty('--p',kp)}
 spb.classList.toggle('rdy',me.gauge>=100)}
function frame(ts){acc+=Math.min(50,ts-lastTs);lastTs=ts;
 while(acc>=16.67){if(NET.role==='guest')gstep();else step();acc-=16.67;if(!running)break}

document.querySelectorAll('.ab').forEach(b=>{const k=b.dataset.k;
 const on=e=>{e.preventDefault();unlock();inp[k]=1;if(k in tp)tp[k]=TPN();vib(8);b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}};

const zl=document.getElementById('zl'),sb=document.getElementById('sb'),kn=sb.firstElementChild;let sid=null,ox=0,oy=0;

 const w=wrap.getBoundingClientRect(),s=sb.offsetWidth;ox=e.clientX;oy=e.clientY;sb.style.left=(ox-w.left-s/2)+'px';sb.style.top=(oy-w.top-s/2)+'px';sb.style.bottom='auto';sb.classList.add('act')});
